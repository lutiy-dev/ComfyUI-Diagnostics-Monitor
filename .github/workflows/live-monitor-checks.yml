name: Live monitor static checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: powershell
        run: |
          foreach ($path in @('collector.ps1','control-center.ps1','dashboard.ps1','lib/ComfyWs.ps1','lib/GpuProcesses.ps1','lib/Hud.ps1','lib/Updates.ps1','configurator.ps1','evidence.ps1','tests/test_live.ps1','tests/test_evidence_reliability.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
            Write-Host "PASS parse $path"
          }
      - name: Test WebSocket event parsing
        shell: powershell
        run: .\tests\test_live.ps1
      - name: Offline update checker unit tests
        shell: powershell
        run: .\tests\test_updates.ps1
      - name: WPF unified UI smoke test (5 tabs / RU + EN)
        shell: powershell
        run: |
          .\control-center.ps1 -SelfTest -DataDir $env:RUNNER_TEMP -Machine HOME
          $ui=Get-Content -LiteralPath 'ui\ControlCenter.xaml' -Raw
          if ($ui -notmatch 'MonitorTab' -or $ui -notmatch 'GenerationsTab' -or $ui -notmatch 'EvidenceTab' -or $ui -notmatch 'SettingsTab') {
            throw 'WPF tabs missing'
          }
          Write-Host 'PASS: five-tab unified WPF initialization'
      - name: Persisted localhost ComfyUI port 8190 WPF smoke
        shell: powershell
        run: |
          $prefsDir=Join-Path $env:RUNNER_TEMP 'PortSmoke'
          New-Item -ItemType Directory -Force -Path $prefsDir | Out-Null
          '{"schema":1,"language":"ru","comfy_port":8190}' | Set-Content -LiteralPath (Join-Path $prefsDir 'ui-settings.json') -Encoding UTF8
          .\control-center.ps1 -SelfTest -DataDir $prefsDir -Machine HOME
          Write-Host 'PASS: saved localhost port 8190 loaded into WPF'
      - name: Unified WPF runtime / hidden Collector smoke test
        shell: powershell
        timeout-minutes: 2
        run: |
          $data=Join-Path $env:RUNNER_TEMP 'UnifiedGuiSmoke'
          .\control-center.ps1 -RuntimeSelfTest -Machine HOME -DataDir $data
          if (-not (Test-Path -LiteralPath $data)) { throw 'Missing runtime test diagnostics' }
          Write-Host 'PASS: one-window WPF + background Collector runtime'
      - name: Test WDDM GPU process snapshot parsing
        shell: powershell
        run: .\tests\test_gpu_processes.ps1
      - name: Windows Forms initialization smoke test
        shell: powershell
        run: .\dashboard.ps1 -SelfTest -DataDir $env:RUNNER_TEMP
      - name: Windows HUD show/hide/restore regression
        shell: powershell
        timeout-minutes: 2
        run: .\dashboard.ps1 -HudSelfTest -DataDir $env:RUNNER_TEMP
      - name: Evidence reliability Windows regression
        shell: powershell
        run: .\\tests\\test_evidence_reliability.ps1
      - name: Test SQLite importer
        shell: pwsh
        run: python -m unittest discover -s tests -v
